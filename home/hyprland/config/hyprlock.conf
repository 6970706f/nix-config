# ~/.config/hypr/hyprlock.conf
# Minimalista — preto predominante, branco como acento

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

# Fundo preto puro
background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraLight
    position = 0, 160
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B" | tr '[:upper:]' '[:lower:]')"
    color = rgba(255, 255, 255, 0.45)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(255, 255, 255, 1.0)
    capslock_color = rgba(255, 255, 255, 0.7)

    fade_on_empty = true
    fade_timeout = 1500
    hide_input = false
    placeholder_text = <span foreground="##ffffff55">···</span>
    fail_text = <span foreground="##ffffff">✕</span>

    position = 0, -60
    halign = center
    valign = center
}

# Usuário
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.3)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

